name: Refresh economic data

on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Retrieve and validate
        id: retrieve
        continue-on-error: true
        run: python refresh.py --log workflow-logs/refresh.log
      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: workflow-logs/refresh.log
          if-no-files-found: ignore
      - name: Commit refresh outcome
        if: ${{ steps.retrieve.outcome == 'success' || steps.retrieve.outcome == 'failure' }}
        run: |
          git add -- data/snapshot.json
          if test -f data/refresh_failures.jsonl; then
            git add -- data/refresh_failures.jsonl
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update economic data refresh outcome'
            git push origin "HEAD:${GITHUB_REF}"
          fi
      - name: Report retrieval failure
        if: ${{ always() && steps.retrieve.outcome == 'failure' }}
        run: exit 1
